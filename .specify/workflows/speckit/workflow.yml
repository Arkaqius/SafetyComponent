schema_version: "1.0"
workflow:
  id: "speckit"
  name: "SafetyComponent Feature Delivery"
  version: "2.0.0"
  author: "SafetyComponent"
  description: "Review StrictDoc artifacts, then dispatch implementation from the Beads graph"

requires:
  speckit_version: ">=1.4.0"
  integrations:
    any: ["codex"]

inputs:
  spec:
    type: string
    required: true
    prompt: "Describe what you want to build"
  feature_directory:
    type: string
    required: true
    prompt: "Enter the feature directory (docs/features/<number>-<slug>)"

steps:
  - id: feature-directory
    type: shell
    strict: true
    run: python .specify/workflows/speckit/guard.py preflight
    env:
      SAFETYCOMPONENT_WORKFLOW_FEATURE: "{{ inputs.feature_directory }}"

  - id: specify
    command: speckit.specify
    integration: codex
    input:
      args: |-
        SPECIFY_FEATURE_DIRECTORY={{ inputs.feature_directory }}
        {{ inputs.spec }}

  - id: validate_spec
    type: shell
    strict: true
    run: python .specify/workflows/speckit/guard.py review-spec
    output_format: json
    env:
      SAFETYCOMPONENT_WORKFLOW_FEATURE: "{{ inputs.feature_directory }}"

  - id: review-spec
    type: gate
    message: "Review scope, stakeholder and HARA coverage, SYS-to-SW allocation, and measurable acceptance criteria before planning."
    options: [approve, reject]
    on_reject: abort

  - id: approved-spec
    type: shell
    strict: true
    run: python .specify/workflows/speckit/guard.py approved-spec
    env:
      SAFETYCOMPONENT_WORKFLOW_FEATURE: "{{ inputs.feature_directory }}"
      SAFETYCOMPONENT_SPEC_REVISION: "{{ steps.validate_spec.output.data.revision }}"

  - id: plan
    command: speckit.plan
    integration: codex
    input:
      args: "SPECIFY_FEATURE_DIRECTORY={{ inputs.feature_directory }}"

  - id: validate_plan
    type: shell
    strict: true
    run: python .specify/workflows/speckit/guard.py review-plan
    output_format: json
    env:
      SAFETYCOMPONENT_WORKFLOW_FEATURE: "{{ inputs.feature_directory }}"
      SAFETYCOMPONENT_SPEC_REVISION: "{{ steps.validate_spec.output.data.revision }}"

  - id: review-plan
    type: gate
    message: "Review the plan, ADRs, contracts and verification.json. Confirm the methods, expected outcomes and target conditions before generating tasks."
    options: [approve, reject]
    on_reject: abort

  - id: approved-plan
    type: shell
    strict: true
    run: python .specify/workflows/speckit/guard.py approved-plan
    env:
      SAFETYCOMPONENT_WORKFLOW_FEATURE: "{{ inputs.feature_directory }}"
      SAFETYCOMPONENT_PLAN_REVISION: "{{ steps.validate_plan.output.data.revision }}"

  - id: tasks
    command: speckit.tasks
    integration: codex
    input:
      args: "SPECIFY_FEATURE_DIRECTORY={{ inputs.feature_directory }}"

  - id: validate-task-graph
    type: shell
    strict: true
    run: python .specify/workflows/speckit/guard.py implementation
    env:
      SAFETYCOMPONENT_WORKFLOW_FEATURE: "{{ inputs.feature_directory }}"
      SAFETYCOMPONENT_PLAN_REVISION: "{{ steps.validate_plan.output.data.revision }}"

  - id: implement
    command: speckit.implement
    integration: codex
    input:
      args: "SPECIFY_FEATURE_DIRECTORY={{ inputs.feature_directory }}"

  - id: verify-completion
    type: shell
    strict: true
    run: python .specify/workflows/speckit/guard.py completed
    env:
      SAFETYCOMPONENT_WORKFLOW_FEATURE: "{{ inputs.feature_directory }}"
      SAFETYCOMPONENT_PLAN_REVISION: "{{ steps.validate_plan.output.data.revision }}"
