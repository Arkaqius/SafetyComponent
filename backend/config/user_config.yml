# Installation-owned values. Copy this file and replace only values
# belonging to the Home Assistant instance. Do not add policy here.
user_config:
  components_enabled:
    TemperatureComponent: true
    SafetyDoorsComponent: true
    ExternalHazardComponent: true
    EntityMonitorComponent: true
  common_entities:
    outside_temp: sensor.dom_temperature
  site:
    latitude: 50.01253611215521
    longitude: 20.116336941719055
    timezone: Europe/Warsaw
    country_code: PL
    teryt_codes:
    - '1219'
  notification:
    mobile:
      services:
      - notify/all_phones
      default_url: https://ha.kojbito.org/5c36e1c9_hakit
    local: {}
    wan_entity: null
  localization:
    language: pl
  safety_components:
