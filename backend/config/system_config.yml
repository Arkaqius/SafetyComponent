system_config:
  version: 2

app_definition:
  module: SafetyFunctions
  class: SafetyFunctions
  log_level: ERROR
  use_dictionary_unpacking: true

validation:
  strict_validation: true
  validate_entity_id_syntax: true
  validate_entity_existence: true

calibration:
  temperature:
    sm_tc_1_debounce_limit: 2
    sm_tc_1_reeval_delay_seconds: 30
    sm_tc_2_debounce_limit: 2
    sm_tc_2_reeval_delay_seconds: 30
    sm_tc_2_derivative_sample_minutes: 15
    sm_tc_min_valid_temperature_c: -40.0
    sm_tc_max_valid_temperature_c: 80.0
    sm_tc_max_abs_rate_c_per_min: 0.25
    sm_tc_max_forecast_delta_c: 6.0
    default_low_temperature_c: 18.0
    default_high_temperature_c: 28.0
    default_forecast_horizon_hours: 2.0

  entity_monitor:
    default_startup_grace_seconds: 60
    default_failure_debounce_seconds: 15
    default_recovery_debounce_seconds: 60
    default_evaluation_interval_seconds: 5
    unhealthy_summary_limit: 32
    component_overrides: {}

  safety_door:
    default_timeout_seconds: 120

  external_hazard:
    default_hazards:
      - frost
      - wind
      - rain
      - storm
      - outdoor_air_pollution
    actuation_mode: manual_and_user_confirmed
    clear_delay_seconds: 120
    weather:
      default_forecast_horizon_hours: 2
      default_frost_watch_c: 2.0
      default_frost_warning_c: 0.0
      default_gust_watch_m_s: 15.0
      default_gust_warning_m_s: 20.0
      default_precipitation_warning_mm_h: 2.5
      default_persistence_seconds: 120
      default_hysteresis:
        temperature_c: 0.5
        gust_m_s: 1.0
    outdoor_air_quality:
      default_standard: european_aqi
      default_warning_at: 60

  internal_environmental_hazard:
    profiles:
      home_assistant_binary_alarm:
        version: "1.0"
        provenance: Home Assistant binary sensor state-event contract
        alarm_states:
          - "on"
        clear_states:
          - "off"
        test_states: []
        unavailable_states:
          - unknown
          - unavailable
        clear_duration_seconds: 30
        authoritative_clear: true
    default_health_failure_debounce_seconds: 5
    default_health_recovery_debounce_seconds: 60
    persistence:
      enabled: true
      state_file: /config/appdaemon/internal_environment_state.json
      maximum_detectors: 64

runtime_cfg:
  faults:
    RiskyTemperature:
      name: Niebezpieczna temperatura
      level: 2
      shadows:
        - RiskyTemperatureForecast
      related_sms:
        - sm_tc_1
        - sm_tc_3
    RiskyTemperatureForecast:
      name: Prognoza niebezpiecznej temperatury
      level: 3
      related_sms:
        - sm_tc_2
        - sm_tc_4
    SafetyDoorOpenTimeout:
      name: Zbyt długo otwarte drzwi lub brama
      level: 2
      related_sms:
        - sm_safety_door_open_timeout
    ExternalWeatherExposure:
      name: Narażenie domu na zagrożenie pogodowe
      level: 2
      related_sms:
        - sm_ext_weather_exposure
    OutdoorAirQualityExposure:
      name: Narażenie domu na zanieczyszczone powietrze
      level: 3
      related_sms:
        - sm_ext_outdoor_air_quality_exposure
    ExternalHazardDataUnavailable:
      name: Brak danych o zagrożeniach zewnętrznych
      level: 3
      related_sms:
        - sm_ext_provider_unavailable
    InternalSmokeDetected:
      name: Wykryto dym
      level: 1
      related_sms:
        - sm_iehm_smoke
    InternalFlammableGasDetected:
      name: Wykryto gaz palny
      level: 1
      related_sms:
        - sm_iehm_flammable_gas
    InternalCarbonMonoxideDetected:
      name: Wykryto tlenek węgla
      level: 1
      related_sms:
        - sm_iehm_carbon_monoxide
    InternalEnvironmentalDetectorUnavailable:
      name: Czujnik zagrożenia środowiskowego jest niedostępny
      level: 3
      related_sms:
        - sm_iehm_detector_health

  providers:
    OpenMeteoWeatherApiComponent:
      enabled: true
      base_url: https://api.open-meteo.com/v1/forecast
      poll_interval_seconds: 600
      request_timeout_seconds: 10
      max_retries: 2
      stale_after_seconds: 1200
    ImgwWarningsApiComponent:
      enabled: true
      base_url: https://danepubliczne.imgw.pl/api/data/warningsmeteo
      poll_interval_seconds: 300
      request_timeout_seconds: 10
      max_retries: 2
      stale_after_seconds: 900
    OpenMeteoAirQualityApiComponent:
      enabled: true
      base_url: https://air-quality-api.open-meteo.com/v1/air-quality
      poll_interval_seconds: 1800
      request_timeout_seconds: 10
      max_retries: 2
      stale_after_seconds: 2700

  notification:
    mobile:
      hass_timeout_seconds: 5
      profiles:
        1:
          color: "#FF0000"
          notification_icon: mdi:exit-run
          android_channel: Safety critical
          android_importance: max
          android_priority: high
          android_ttl: 0
          vibration_pattern: 100, 1000, 100, 1000, 100
          ios_interruption_level: time-sensitive
          ios_critical_sound: false
        2:
          color: "#FFA500"
          notification_icon: mdi:hazard-lights
          android_channel: Safety hazards
          android_importance: high
          android_priority: high
          android_ttl: 0
          vibration_pattern: 100, 500, 100, 500
          ios_interruption_level: time-sensitive
          ios_critical_sound: false
        3:
          color: "#FFFF00"
          notification_icon: mdi:home-alert
          android_channel: Safety warnings
          android_importance: default
          android_priority: normal
          android_ttl: 0
          vibration_pattern: null
          ios_interruption_level: active
          ios_critical_sound: false
    retry:
      max_attempts: 3
      base_delay_seconds: 5
      max_delay_seconds: 60
      deadlines_seconds:
        1: 10
        2: 30
        3: 30
    level_one_repeat:
      enabled: true
      interval_seconds: 60
      max_repeats: 3
    persistence:
      enabled: true
      state_file: /config/appdaemon/notification_state.json

  recovery:
    persistence:
      enabled: true
      state_file: /config/appdaemon/recovery_state.json

  mqtt:
    discovery_prefix: homeassistant
    base_topic: safety_component
    availability_topic: safety_component/status
    device_identifier: safety_component
    device_name: Safety Component
    retain_discovery: true
    retain_state: false
    clear_retained_state_on_start: true
    qos: 0
    heartbeat_seconds: 60
    expire_after: 180
    legacy_discovery_entity_ids: []
