SafetyFunctions:
  # AppDaemon app definition (standard fields)
  module: SafetyFunctions
  class: SafetyFunctions
  log_level: ERROR
  use_dictionary_unpacking: true

  # ---------------------------------------------------------------------------
  # Global (instance-independent) application policy.
  #
  # Keep this identical across all production installations.
  # This section reflects the application's safety concept and platform policy
  # (e.g., HARA-derived requirements, safety goals, and validation strategy).
  #
  # Development note:
  # During active development you may temporarily relax strictness/validation,
  # but production should run with strict validation enabled.
  # ---------------------------------------------------------------------------
  app_config:
    # Config versioning: bump when you introduce breaking config changes.
    config_version: 1

    # Strictness:
    # - true  -> reject unknown keys in app_config/user_config (fail-fast)
    # - false -> allow unknown keys (log warnings), useful during migration
    strict_validation: true

    # Entity validation policy and startup dependency checks:
    validation:
      # Always validate basic entity_id syntax ("domain.object_id")
      validate_entity_id_syntax: true

      # If true, verify each referenced entity exists in HA during initialize().
      # Recommended: true for production to avoid silently running with wrong IDs.
      validate_entity_existence: true

    # Calibration defaults for safety components.
    calibration:
      temperature:
        # Debounce counter threshold for sm_tc_1 before setting/clearing symptoms.
        SM_TC_1_DEBOUNCE_LIMIT: 2
        # Delay before re-evaluating sm_tc_1 when debouncing requires another run.
        SM_TC_1_REEVAL_DELAY_SECONDS: 30
        # Debounce counter threshold for sm_tc_2 before setting/clearing symptoms.
        SM_TC_2_DEBOUNCE_LIMIT: 2
        # Delay before re-evaluating sm_tc_2 when debouncing requires another run.
        SM_TC_2_REEVAL_DELAY_SECONDS: 30
        # Sampling interval (minutes) used to register derivative monitoring for sm_tc_2.
        SM_TC_2_DERIVATIVE_SAMPLE_MINUTES: 15

    external_hazard_policy:
      notification_only: true
      decision_timeout_seconds: 1
      clear_delay_seconds: 120
      weather:
        forecast_horizon_hours: 12
        frost_watch_c: 2.0
        frost_warning_c: 0.0
        gust_watch_m_s: 15.0
        gust_warning_m_s: 20.0
        precipitation_warning_mm_h: 2.5
        persistence_seconds: 120
        hysteresis:
          temperature_c: 0.5
          gust_m_s: 1.0
      outdoor_air_quality:
        standard: european_aqi
        warning_at: 60
      providers:
        OpenMeteoWeatherApiComponent:
          base_url: "https://api.open-meteo.com/v1/forecast"
          poll_interval_seconds: 600
          request_timeout_seconds: 10
          max_retries: 2
          stale_after_seconds: 1200
        ImgwWarningsApiComponent:
          base_url: "https://danepubliczne.imgw.pl/api/data/warningsmeteo"
          poll_interval_seconds: 300
          request_timeout_seconds: 10
          max_retries: 2
          stale_after_seconds: 900
        OpenMeteoAirQualityApiComponent:
          base_url: "https://air-quality-api.open-meteo.com/v1/air-quality"
          poll_interval_seconds: 1800
          request_timeout_seconds: 10
          max_retries: 2
          stale_after_seconds: 2700

    # Global fault catalog (shared policy).
    #
    # IMPORTANT:
    # This catalog is part of the internal safety concept (HARA + system requirements).
    # It defines which faults exist and their classification (e.g., level/severity).
    #
    # Rules:
    # - Treat fault identifiers (keys) as stable API (used by components, logs, dashboards).
    # - Do not change or delete faults casually. Changes should follow the safety process:
    #   update HARA/requirements -> update fault catalog -> update tests -> release.
    # - House-specific tuning belongs in user_config (entities/thresholds), not here.
    faults:
      RiskyTemperature:
        name: "Niebezpieczna temperatura"
        level: 2
        shadows:
          - "RiskyTemperatureForecast"
        related_sms:
          - "sm_tc_1"
          - "sm_tc_3"
      RiskyTemperatureForecast:
        name: "Prognoza niebezpiecznej temperatury"
        level: 3
        related_sms:
          - "sm_tc_2"
          - "sm_tc_4"
      SafetyDoorOpenTimeout:
        name: "Zbyt długo otwarte drzwi lub brama"
        level: 2
        related_sms:
          - "sm_safety_door_open_timeout"
      ExternalWeatherExposure:
        name: "Narażenie domu na zagrożenie pogodowe"
        level: 2
        related_sms:
          - "sm_ext_weather_exposure"
      OutdoorAirQualityExposure:
        name: "Narażenie domu na zanieczyszczone powietrze"
        level: 3
        related_sms:
          - "sm_ext_outdoor_air_quality_exposure"
      ExternalHazardDataUnavailable:
        name: "Brak danych o zagrożeniach zewnętrznych"
        level: 3
        related_sms:
          - "sm_ext_provider_unavailable"

  # ---------------------------------------------------------------------------
  # House/installation specific configuration (entities, thresholds, enablement).
  # This section is expected to differ per instance/home.
  #
  # Intent:
  # - Define which components are enabled in this house.
  # - Provide the concrete Home Assistant entity IDs used by the app.
  # - Provide calibration thresholds and room-specific settings.
  # ---------------------------------------------------------------------------
  user_config:
    # Feature selection / enablement (house-specific intent).
    #
    # Validation rule:
    # - If <ComponentName>: true  -> corresponding safety_components.<ComponentName>
    #   must exist and be valid (otherwise FAIL-FAST).
    # - If <ComponentName>: false -> component is not instantiated; config may be absent.
    components_enabled:
      TemperatureComponent: true
      SafetyDoorsComponent: true
      ExternalHazardComponent: true
      # WaterLeakComponent: false
      # SmokeComponent: false

    # Notification feature configuration.
    #
    # This section defines the entities/endpoints used to notify the user, such as:
    # - indicator lamps/lights
    # - mobile notification services
    # - speakers / TTS entities
    # - other annunciators
    #
    # NOTE:
    # Even if only a subset is used today (e.g., warning light), keep this as the
    # single place to expand notification channels without leaking entities into
    # individual safety components.
    notification: {}
    # light_entity: "light.livingroom_rightstrip_controler"
    # future examples:
    # phone_notify_service: "notify.mobile_app_my_phone"
    # tts_media_player: "media_player.livingroom_speaker"

    # User-facing language. Backend state codes and entity IDs remain stable
    # English API values; Home Assistant names, state_label attributes, and
    # notification copy are localized for this installation.
    localization:
      language: "pl"
      entity_names:
        sensor.safety_app_health: "Stan aplikacji bezpieczeństwa"
        sensor.safetysystem_state: "Stan systemu bezpieczeństwa"
        sensor.fault_riskytemperature: "Niebezpieczna temperatura"
        sensor.fault_riskytemperatureforecast: "Prognoza niebezpiecznej temperatury"
        sensor.fault_safetydooropentimeout: "Zbyt długo otwarte drzwi lub brama"
        sensor.fault_externalweatherexposure: "Narażenie domu na zagrożenie pogodowe"
        sensor.fault_outdoorairqualityexposure: "Narażenie domu na zanieczyszczone powietrze"
        sensor.fault_externalhazarddataunavailable: "Brak danych o zagrożeniach zewnętrznych"
        sensor.external_hazard_state: "Zagrożenia zewnętrzne"
        sensor.external_provider_open_meteo_weather: "Dane pogodowe Open-Meteo"
        sensor.external_provider_imgw_warnings: "Ostrzeżenia IMGW"
        sensor.external_provider_open_meteo_air_quality: "Jakość powietrza Open-Meteo"
        sensor.safety_door_garagegate: "Brama garażowa"
        sensor.safety_door_externalgate: "Brama zewnętrzna"
        sensor.safety_door_livingroomterracedoor: "Drzwi tarasowe w salonie"
        sensor.safety_door_garagedoor: "Drzwi do garażu"

    # Common (shared) entities used across the whole application.
    #
    # This is the "shared entity registry" for signals that are not tied to a single
    # SafetyComponent, but are used by multiple components or by the app core.
    #
    # Examples:
    # - outside temperature (used by many temperature-related mechanisms)
    # - energy price, humidity baseline, occupancy, etc.
    common_entities:
      outside_temp: "sensor.dom_temperature"

    site:
      latitude: 50.01253611215521
      longitude: 20.116336941719055
      timezone: Europe/Warsaw
      country_code: PL
      teryt_codes:
        - "1219"

    api_components:
      OpenMeteoWeatherApiComponent:
        enabled: true
      ImgwWarningsApiComponent:
        enabled: true
      OpenMeteoAirQualityApiComponent:
        enabled: true

    # MQTT entity publishing.
    #
    # SafetyFunctions creates its internal entities through Home Assistant MQTT
    # discovery instead of AppDaemon set_state. State updates are published to
    # MQTT state topics and JSON attributes to attributes topics. Recovery
    # actuators continue to use native Home Assistant services.
    mqtt:
      discovery_prefix: "homeassistant"
      base_topic: "safety_component"
      availability_topic: "safety_component/status"
      device_identifier: "safety_component"
      device_name: "Safety Component"
      retain_discovery: true
      retain_state: false
      clear_retained_state_on_start: true
      qos: 0
      heartbeat_seconds: 60
      expire_after: 180

    # Safety components configuration (house-specific calibration + entities).
    #
    # Each component has its own schema. If a component is enabled above, its
    # config must exist here and must be valid.
    safety_components:
      ExternalHazardComponent:
        openings:
          BathroomWindow:
            area_id: "bathroom"
            entity_id: "binary_sensor.bathroom_window_contact_contact"
            friendly_name: "Okno łazienki"
            kind: window
            hazards: [frost, wind, rain, storm, outdoor_air_pollution]
          BedroomLeftWindow:
            area_id: "45dba350035011ebb7723b97d0dd3541"
            entity_id: "binary_sensor.bedroom_windowleft_sensor_contact"
            friendly_name: "Lewe okno sypialni"
            kind: window
            hazards: [frost, wind, rain, storm, outdoor_air_pollution]
          BedroomRightWindow:
            area_id: "45dba350035011ebb7723b97d0dd3541"
            entity_id: "binary_sensor.bedroom_windowright_sensor_contact_contact"
            friendly_name: "Prawe okno sypialni"
            kind: window
            hazards: [frost, wind, rain, storm, outdoor_air_pollution]
          KidsRoomWindow:
            area_id: "kids_room"
            entity_id: "binary_sensor.kidsroom_window_contact_contact"
            friendly_name: "Okno pokoju dzieci"
            kind: window
            hazards: [frost, wind, rain, storm, outdoor_air_pollution]
          KitchenWindow:
            area_id: "45db9126035011ebb67629f8118eef32"
            entity_id: "binary_sensor.kitchen_window_contact_contact"
            friendly_name: "Okno kuchni"
            kind: window
            hazards: [frost, wind, rain, storm, outdoor_air_pollution]
          LivingRoomTerraceDoor:
            area_id: "45db77f4035011eb9a3115c8afedaa08"
            entity_id: "binary_sensor.livingroom_door_contact_contact"
            friendly_name: "Drzwi tarasowe salonu"
            kind: door
            hazards: [frost, wind, rain, storm, outdoor_air_pollution]
          LivingRoomWindow:
            area_id: "45db77f4035011eb9a3115c8afedaa08"
            entity_id: "binary_sensor.livingroom_window_contact_contact"
            friendly_name: "Okno salonu"
            kind: window
            hazards: [frost, wind, rain, storm, outdoor_air_pollution]
          OfficeWindow:
            area_id: "office"
            entity_id: "binary_sensor.office_window_contact_contact"
            friendly_name: "Okno biura"
            kind: window
            hazards: [frost, wind, rain, storm, outdoor_air_pollution]
          EntranceDoor:
            area_id: "entryway"
            entity_id: "binary_sensor.entrance_door_contact_contact"
            friendly_name: "Drzwi wejściowe"
            kind: door
            hazards: [frost, wind, rain, storm, outdoor_air_pollution]
          GarageGate:
            area_id: "garage"
            entity_id: "binary_sensor.garage_gatedoorlow_contact_contact"
            friendly_name: "Brama garażowa"
            kind: garage_door
            hazards: [frost, wind, rain, storm, outdoor_air_pollution]
          UpperBathroomWindow:
            area_id: "upper_bathroom"
            entity_id: "binary_sensor.upperbathroom_window_contact_contact"
            friendly_name: "Okno górnej łazienki"
            kind: window
            hazards: [frost, wind, rain, storm, outdoor_air_pollution]

      SafetyDoorsComponent:
        defaults:
          # SYS-SR-DOOR-001: maximum continuous open time before activation.
          timeout_seconds: 120
        doors:
          GarageGate:
            area_id: "garage"
            entity_id: "binary_sensor.garage_gatedoorlow_contact_contact"
            timeout_seconds: 300
          ExternalGate:
            area_id: "frontyard"
            entity_id: "binary_sensor.frontyard_externalgate_contact_contact"
            timeout_seconds: 300
          LivingRoomTerraceDoor:
            area_id: "45db77f4035011eb9a3115c8afedaa08"
            entity_id: "binary_sensor.livingroom_door_contact_contact"
            # Monitor the terrace door only while the home is empty.
            condition:
              entity_id: "sensor.home_monitor_occupancy"
              pass_states:
                - "empty"
              blocked_states:
                - "occupied"
          GarageDoor:
            area_id: "garage"
            entity_id: "binary_sensor.garage_door_contact_contact"
            timeout_seconds: 900

      TemperatureComponent:
        # Defaults shared across rooms, can be overridden per room.
        defaults:
          CAL_LOW_TEMP_THRESHOLD: 18.0
          CAL_HIGH_TEMP_THRESHOLD: 28.0
          CAL_FORECAST_TIMESPAN: 2.0 # hours

        # Per-room configuration
        rooms:
          Office:
            area_id: "office"
            temperature_sensor: "sensor.office_climatesensor_temperature"
            window_sensor: "binary_sensor.office_window_contact_contact"

          Bedroom:
            area_id: "45dba350035011ebb7723b97d0dd3541"
            temperature_sensor: "sensor.bedroom_climatesensor_temperature"
            window_sensor: "binary_sensor.bedroom_windowleft_sensor_contact"

          #Bathroom:
          #  temperature_sensor: "sensor.bathroom_temperature"
          #  window_sensor: "binary_sensor.bathroom_window_contact_contact"

          Livingroom:
            area_id: "45db77f4035011eb9a3115c8afedaa08"
            temperature_sensor: "sensor.livingroom_climatesensor_temperature"
            window_sensor: "binary_sensor.livingroom_door_contact_contact"

          Kitchen:
            area_id: "45db9126035011ebb67629f8118eef32"
            # The downstairs HC1 thermostat is the corridor temperature source.
            temperature_sensor: "sensor.thermostat_hc1_current_room_temperature_2"
            window_sensor: "binary_sensor.kitchen_window_contact_contact"

          Entrance:
            area_id: "entryway"
            temperature_sensor: "sensor.entrance_climatesensor_temperature"
            window_sensor: null

          Garage:
            area_id: "garage"
            # Override defaults for this room
            CAL_LOW_TEMP_THRESHOLD: 10.0
            CAL_HIGH_TEMP_THRESHOLD: 28.0
            CAL_FORECAST_TIMESPAN: 2.0
            temperature_sensor: "sensor.garage_climatesensor_temperature"
            window_sensor: "binary_sensor.garage_gatedoorlow_contact_contact"

          Kidsroom:
            area_id: "kids_room"
            temperature_sensor: "sensor.kidsroom_climatesensor_temperature"
            window_sensor: "binary_sensor.kidsroom_window_contact_contact"

          Upperbathroom:
            area_id: "upper_bathroom"
            temperature_sensor: "sensor.upperbathroom_climatesensor_temperature"
            #window_sensor: "sensor.upperbathroom_window_contact_contact"
