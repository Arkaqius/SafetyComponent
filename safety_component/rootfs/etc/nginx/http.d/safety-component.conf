server {
    listen 8099 default_server;
    server_name _;

    allow 172.30.32.2;
    allow 127.0.0.1;
    deny all;

    root /opt/safety-component/frontend;
    index index.html;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
