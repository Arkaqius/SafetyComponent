name: SafetyComponent
version: 0.3.1
slug: safety_component
description: Safety monitoring backend and Safety Home UI for Home Assistant
url: https://github.com/Arkaqius/SafetyComponent
image: ghcr.io/arkaqius/safetyfunctions
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
stage: experimental
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:alarm-light
panel_title: Safety Home
panel_admin: true
watchdog: tcp://[HOST]:[PORT:8099]
backup: cold
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Safety Home web interface (Ingress only)
map:
  - type: addon_config
    read_only: false
    path: /config
options:
  log_level: info
schema:
  log_level: list(debug|info|warning|error|fatal)
